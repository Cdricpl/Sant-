<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0ea5b7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Santé+" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Santé+</title>
    <meta name="description" content="Votre compagnon santé personnel — poids, médicaments, analyses, rendez-vous et vaccins." />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Chien de garde anti-page-blanche.
      // Si l'application n'a pas démarré au bout de 10 s (fichier JS manquant du
      // cache et du serveur, service worker corrompu…), on purge caches +
      // service workers et on recharge. Une seule tentative par onglet, pour ne
      // jamais boucler.
      (function () {
        var GRACE_MS = 10000;
        var FLAG = "sante:auto-repair";
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && root.childElementCount > 0) return; // démarrage OK
          if (sessionStorage.getItem(FLAG)) return; // déjà tenté
          sessionStorage.setItem(FLAG, "1");
          var done = function () {
            location.reload();
          };
          var jobs = [];
          if (window.caches) jobs.push(caches.keys().then(function (k) {
            return Promise.all(k.map(function (n) { return caches.delete(n); }));
          }));
          if (navigator.serviceWorker) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }));
          }
          Promise.all(jobs).then(done, done);
        }, GRACE_MS);
      })();
    </script>
  </body>
</html>
